server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/pianorep?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
app.jwt.secret=${JWT_SECRET:changeme-this-must-be-at-least-256-bits-long-secret-key}
app.jwt.expiration-ms=86400000

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID}

# Stripe
app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.stripe.price-id=${STRIPE_PRICE_ID}
app.stripe.success-url=${FRONTEND_URL:http://localhost:5173}/subscription/success?session_id={CHECKOUT_SESSION_ID}
app.stripe.cancel-url=${FRONTEND_URL:http://localhost:5173}/pricing

# Admin
app.admin.emails=${ADMIN_EMAILS:raj.selvaraj.arch@gmail.com,julieknerrpiano@gmail.com}

# Trial
app.trial.days=${TRIAL_DAYS:30}

# Multipart upload limits (for bulk CSV and ZIP image uploads)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Incipit images
app.incipit.images-path=${INCIPIT_IMAGES_PATH:/Users/lourdurajselvaraj/claude/pianodata/images}

# CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Logging
logging.level.com.pianorep=DEBUG
