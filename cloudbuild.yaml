# Cloud Build CI/CD pipeline for PianoRep
# Triggered manually: gcloud builds submit --config cloudbuild.yaml .
# Or via GitHub Actions / Cloud Build trigger.
#
# Required substitutions (set in Cloud Build trigger or --substitutions flag):
#   _REGION          e.g. us-central1
#   _REPO            Artifact Registry repo name, e.g. pianorep
#   _BACKEND_SERVICE Cloud Run service name, e.g. pianorep-backend
#   _DB_HOST         Cloud SQL private IP or connection string
#   _DB_NAME         Database name, e.g. pianorep
#   _FRONTEND_URL    Deployed frontend URL, e.g. https://pianorep.web.app
#
# Required secrets in Secret Manager (created by setup-gcp.sh):
#   pianorep-db-username
#   pianorep-db-password
#   pianorep-jwt-secret
#   pianorep-google-client-id
#   pianorep-stripe-secret-key
#   pianorep-stripe-webhook-secret
#   pianorep-stripe-price-id

steps:
  # ── Backend: Build Docker image ──────────────────────────────────────────
  - id: build-backend
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$SHORT_SHA'
      - -t
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest'
      - ./backend

  # ── Backend: Push to Artifact Registry ──────────────────────────────────
  - id: push-backend
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend'
    waitFor: [build-backend]

  # ── Backend: Deploy to Cloud Run ─────────────────────────────────────────
  - id: deploy-backend
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_BACKEND_SERVICE'
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=INCIPIT_IMAGES_PATH=/app/images,FRONTEND_URL=$_FRONTEND_URL,DB_HOST=$_DB_HOST,DB_NAME=$_DB_NAME
      - --set-secrets=DB_USERNAME=pianorep-db-username:latest,DB_PASSWORD=pianorep-db-password:latest,JWT_SECRET=pianorep-jwt-secret:latest,GOOGLE_CLIENT_ID=pianorep-google-client-id:latest,STRIPE_SECRET_KEY=pianorep-stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=pianorep-stripe-webhook-secret:latest,STRIPE_PRICE_ID=pianorep-stripe-price-id:latest
    waitFor: [push-backend]

  # ── Frontend: Install dependencies ───────────────────────────────────────
  - id: install-frontend
    name: 'node:20-alpine'
    entrypoint: sh
    args:
      - -c
      - cd frontend && npm ci --prefer-offline
    waitFor: ['-']  # run in parallel with backend build

  # ── Frontend: Build (needs backend URL from Cloud Run) ───────────────────
  - id: build-frontend
    name: 'node:20-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        cd frontend
        BACKEND_URL=$(cat /workspace/backend_url.txt 2>/dev/null || echo "")
        VITE_API_BASE_URL=$${BACKEND_URL} \
        VITE_GOOGLE_CLIENT_ID=$$(cat /workspace/google_client_id.txt) \
          npm run build
    secretEnv: []
    waitFor: [install-frontend, deploy-backend]

  # ── Frontend: Get backend URL and store for frontend build ────────────────
  - id: get-backend-url
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: sh
    args:
      - -c
      - |
        gcloud run services describe $_BACKEND_SERVICE \
          --region=$_REGION \
          --format='value(status.url)' > /workspace/backend_url.txt
        echo "Backend URL: $(cat /workspace/backend_url.txt)"
    waitFor: [deploy-backend]

  # ── Frontend: Deploy to Firebase Hosting ─────────────────────────────────
  - id: deploy-frontend
    name: 'node:20-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        npm install -g firebase-tools --silent
        cd frontend
        firebase deploy --only hosting --token "$$FIREBASE_TOKEN" --non-interactive
    secretEnv: [FIREBASE_TOKEN]
    waitFor: [build-frontend, get-backend-url]

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:$SHORT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/backend:latest'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/pianorep-firebase-token/versions/latest
      env: FIREBASE_TOKEN

substitutions:
  _REGION: us-central1
  _REPO: pianorep
  _BACKEND_SERVICE: pianorep-backend
  _DB_HOST: '127.0.0.1'
  _DB_NAME: pianorep
  _FRONTEND_URL: 'https://your-project.web.app'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
